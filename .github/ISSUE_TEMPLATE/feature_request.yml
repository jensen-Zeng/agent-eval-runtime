name: Feature request
description: Suggest a concrete improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What task are you trying to accomplish, and what prevents it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example and any alternatives considered.
    validations:
      required: true
