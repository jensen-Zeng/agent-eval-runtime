services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenteval
      POSTGRES_DB: agenteval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment before starting Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agenteval-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenteval -d agenteval"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  agenteval-postgres-data: